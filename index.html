<style>

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:15px;line-height:1.75}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.serif{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
/* masthead */
.mast{border-bottom:3px double var(--ink);background:var(--bg)}
.mast .top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:22px 0 8px;flex-wrap:wrap}
.logo{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(30px,4.6vw,46px);line-height:1;text-decoration:none;letter-spacing:.04em}
.logo small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500;font-size:13px;letter-spacing:0;color:var(--muted);margin-top:8px}
.dateline{font-size:12.5px;color:var(--muted);text-align:right}
nav.gnav{display:flex;gap:4px;overflow-x:auto;border-top:1px solid var(--line);padding:6px 0;scrollbar-width:none}
nav.gnav a{white-space:nowrap;text-decoration:none;font-weight:700;font-size:14px;padding:4px 12px;border-radius:999px}
nav.gnav a[aria-current="page"]{background:var(--ink);color:var(--surface)}
main{padding:24px 0 10px}
.kicker{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.08em}
h1.page{font-family:"Shippori Mincho B1",serif;font-size:clamp(28px,4vw,40px);line-height:1.25;margin:2px 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none}
/* home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:22px}
.hero p{margin:6px 0}
.feed h2,.sec h2{font-family:"Shippori Mincho B1",serif;font-size:20px;margin:0 0 8px;border-bottom:1px solid var(--ink);padding-bottom:4px}
.feed ol{list-style:none;margin:0;padding:0}
.feed li{border-bottom:1px solid var(--line);padding:7px 0}
.feed a{text-decoration:none;font-weight:500}
.feed a:hover{text-decoration:underline}
.feed .m{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px;text-decoration:none}
.card:hover{border-color:var(--ink)}

.pos-t{color:var(--pos)} .neg-t{color:var(--neg)} .mut-t{color:var(--muted)}

.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
#net{display:block;width:100%;height:min(70vh,640px);min-height:460px;touch-action:none;cursor:grab}
.hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:var(--muted);pointer-events:none}
.sizenote{position:absolute;left:12px;top:10px;font-size:12px;color:var(--muted);pointer-events:none;max-width:62%}
.reset{position:absolute;right:10px;top:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:12.5px;border-radius:6px;padding:3px 10px;cursor:pointer}
.legend{font-size:13px;color:var(--muted);margin:8px 0 0}
.link{stroke:var(--edge);stroke-width:1.3}
.link.pos{stroke:var(--pos);stroke-width:2.2}
.link.neg{stroke:var(--neg);stroke-dasharray:5 4;stroke-width:1.8}
.node{cursor:pointer}
.node text{font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round;fill:var(--ink);pointer-events:none}
.node.hub text{font-size:14.5px;font-weight:700}
.node.hub text.val{font-size:11px;font-weight:500;fill:var(--muted)}
.node.news text{font-size:12.5px;font-weight:500}
.node:focus{outline:none}
.node:focus-visible circle,.node:focus-visible rect{stroke:var(--ink);stroke-width:3}
.dim{opacity:.1}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}

.lnk{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lnk:hover{text-decoration-color:var(--ink)}
.close{display:none}
.cta{display:block;margin-top:16px;padding:10px 12px;border:1px solid var(--ink);border-radius:8px;text-decoration:none;font-weight:700;font-size:14px}
.cta small{display:block;font-weight:400;color:var(--muted)}
.sec{margin-top:28px}

.rank th{font-size:12.5px;color:var(--muted);font-weight:500}
.rank td.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.list article{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.list h3{margin:0;font-size:16px}
.list p{margin:4px 0}
.prose{max-width:46em}
.prose h2{font-family:"Shippori Mincho B1",serif;font-size:20px;margin:26px 0 6px}
footer{border-top:3px double var(--ink);margin-top:36px;color:var(--muted);font-size:12.5px;padding:18px 0 36px}

  .close{display:block;position:absolute;right:14px;top:10px;background:none;border:0;font-size:24px;color:var(--muted);cursor:pointer}
  aside .intro{display:none}

@media (max-width:640px){ .cards{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const FB=JSON.parse(document.getElementById("fallback").textContent);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const main=document.getElementById("main");
let IDX, IND={};
async function getJSON(p,key){try{const r=await fetch(p,{cache:"no-store"});if(!r.ok)throw 0;return await r.json()}catch(e){return key?FB[key]:FB.industries}}
async function loadAll(){IDX=await getJSON("data/industries.json");for(const i of IDX.industries){IND[i.id]=await getJSON(`data/${i.id}.json`,i.id)}}
const cta=`<a class="cta" href="#/about">株に投資する方法を見る<small>個別株・投資信託・NISAの違いを整理するページ（準備中）</small></a>`;
function scores(ind){
  const s={}; ind.companies.forEach(c=>s[c.id]={pos:0,neg:0});
  ind.news.forEach(n=>n.companies.forEach(x=>{if(s[x.id]){x.dir>0?s[x.id].pos++:s[x.id].neg++}}));
  return s;
}
function coName(ind,id){return ind.companies.find(c=>c.id===id)?.name||id}
function nav(active){
  document.getElementById("gnav").innerHTML=`<a href="#/" ${active==="home"?'aria-current="page"':""}>トップ</a>`+
    IDX.industries.map(i=>`<a href="#/i/${i.id}" ${active===i.id?'aria-current="page"':""}>${esc(i.name)}</a>`).join("")+
    `<a href="#/about" ${active==="about"?'aria-current="page"':""}>このサイトについて</a>`;
  const up=Object.values(IND).map(i=>i.updated).sort().pop();
  document.getElementById("dateline").textContent=`${up} 更新・試作版`;
}
/* ---------- home ---------- */
function home(){
  nav("home"); document.title="業界勢力図｜ニュースで動く、会社の追い風と向かい風";
  const all=[];Object.values(IND).forEach(ind=>ind.news.filter(n=>!n.ongoing).forEach(n=>all.push({ind,n})));
  all.sort((a,b)=>b.n.date.localeCompare(a.n.date));
  const feed=all.slice(0,8).map(({ind,n})=>`<li><a href="#/i/${ind.id}/${n.id}">${esc(n.title)}</a><div class="m">${esc(ind.name)}・${esc(n.date)}</div></li>`).join("");
  const cards=IDX.industries.map(i=>{
    const ind=IND[i.id], s=scores(ind), arr=Object.entries(s);
    const best=arr.filter(x=>x[1].pos>0).sort((a,b)=>(b[1].pos-b[1].neg)-(a[1].pos-a[1].neg))[0];
    const worst=arr.filter(x=>x[1].neg>0).sort((a,b)=>(b[1].neg-b[1].pos)-(a[1].neg-a[1].pos))[0];
    const heads=ind.news.filter(n=>!n.ongoing).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(n=>`<li>${esc(n.title)}</li>`).join("");
    return `<a class="card" href="#/i/${ind.id}"><div class="kicker">${esc(ind.period)}</div><h3>${esc(ind.name)}</h3><p class="tl">${esc(ind.tagline)}</p>
      <div class="stat">${best?`<span class="chip pos-t">追い風：${esc(coName(ind,best[0]))}</span>`:""}${worst?`<span class="chip neg-t">向かい風：${esc(coName(ind,worst[0]))}</span>`:""}<span class="chip mut-t">ニュース${ind.news.length}件</span></div>
      <ul>${heads}</ul><span class="go">勢力図を見る →</span></a>`;}).join("");
  main.innerHTML=`<section class="hero"><div><div class="kicker">今週の勢力図</div>
    <h1 class="page">ニュースは、どの会社の<br>追い風になったか。</h1>
    <p>業界ごとに主要な会社を並べ、その週のニュースが「追い風」か「向かい風」かを線でつないだ地図を毎週更新しています。丸の大きさは時価総額です。</p>
    <p class="meta">元記事へのリンク付き。見出しと要約は編集部が独自に作成しています。</p></div>
    <div class="feed"><h2>新着ニュース</h2><ol>${feed}</ol></div></section>
    <section><h2 class="serif" style="font-size:22px;margin:0 0 12px">業界の勢力図</h2><div class="cards">${cards}</div></section>`;
}
/* ---------- industry ---------- */
let G={};
function industry(id,focusNews){
  const ind=IND[id]; if(!ind){home();return}
  nav(id); document.title=`${ind.name}の勢力図｜業界勢力図`;
  const s=scores(ind);
  const rows=[...ind.companies].sort((a,b)=>(b.size??-1)-(a.size??-1)).map(c=>`<tr><td><button class="lnk" onclick="selectNode('hub:${c.id}')">${esc(c.name)}</button></td><td class="n">${c.size!=null?c.size+"兆円":"確認中"}</td><td class="n pos-t">${s[c.id].pos}</td><td class="n neg-t">${s[c.id].neg}</td></tr>`).join("");
  const list=[...ind.news].sort((a,b)=>b.date.localeCompare(a.date)).map(n=>{
    const ch=n.companies.map(x=>`<span class="chip ${x.dir>0?"pos-t":"neg-t"}">${esc(coName(ind,x.id))}に${x.dir>0?"追い風":"向かい風"}</span>`).join("")+(n.tags||[]).map(t=>`<span class="chip mut-t">${esc(t)}</span>`).join("");
    const src=(n.sources||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`).join("／");
    return `<article id="a-${n.id}"><h3>${esc(n.title)}</h3><div class="meta">${esc(n.date)}${n.ongoing?"・続いているテーマ":""}・${esc(n.confidence)}</div><p>${esc(n.summary)}</p><div>${ch}</div><div class="meta">元記事：${src}</div></article>`;}).join("");
  main.innerHTML=`<div class="crumb"><a href="#/">トップ</a> ／ ${esc(ind.name)}</div>
  <div class="kicker">${esc(ind.period)}</div><h1 class="page">${esc(ind.name)}の勢力図</h1><p class="sub">${esc(ind.tagline)}</p>
  <div class="layout"><div>
    <div class="stage"><svg id="net" role="img" aria-label="${esc(ind.name)}の会社とニュースのつながり"></svg>
      <div class="sizenote">円の大きさ：${esc(ind.size.label)}（${esc(ind.size.asof)}）</div>
      <button class="reset" id="resetBtn">全体表示</button><div class="hint">ドラッグで移動・ホイールやピンチで拡大・丸や四角を押すと詳細</div></div>
    <p class="legend"><span class="pos-t">緑の線＝追い風</span>　<span class="neg-t">赤い点線＝向かい風</span>　四角＝ニュース、丸＝会社（赤系は日本、青系は海外）</p>
    <section class="sec"><h2>会社別の追い風・向かい風</h2><div class="tablewrap"><table class="rank"><thead><tr><th>会社</th><th class="n">時価総額</th><th class="n">追い風</th><th class="n">向かい風</th></tr></thead><tbody>${rows}</tbody></table></div></section>
    <section class="sec list"><h2>ニュース一覧（${ind.news.length}件）</h2>${list}</section>
  </div><aside id="panel" aria-live="polite"></aside></div>`;
  G={ind}; buildGraph(); drawGraph();
  document.getElementById("resetBtn").onclick=()=>{d3.select("#net").transition().duration(300).call(G.zoom.transform,d3.zoomIdentity);intro()};
  if(focusNews) selectNode("news:"+focusNews); else intro();
}
function buildGraph(){
  const ind=G.ind, nodes=[], links=[];
  const vmax=Math.max(...ind.companies.filter(c=>c.size!=null).map(c=>c.size),1);
  ind.companies.forEach(c=>nodes.push({id:"hub:"+c.id,type:"hub",label:c.name,ref:c,r:c.size==null?16:16+36*Math.sqrt(c.size/vmax)}));
  ind.news.forEach(n=>{nodes.push({id:"news:"+n.id,type:"news",label:n.title,ref:n});
    n.companies.forEach(x=>links.push({source:"news:"+n.id,target:"hub:"+x.id,kind:x.dir>0?"pos":"neg"}))});
  G.nodes=nodes;G.links=links;
}
function drawGraph(){
  const svg=d3.select("#net"); svg.selectAll("*").remove();
  const W=svg.node().clientWidth,H=svg.node().clientHeight, {nodes,links}=G;
  const g=svg.append("g");
  G.zoom=d3.zoom().scaleExtent([0.3,4]).on("zoom",e=>g.attr("transform",e.transform));
  svg.call(G.zoom).on("dblclick.zoom",null);
  svg.on("click",e=>{if(e.target===svg.node())intro()});
  const hubs=nodes.filter(n=>n.type==="hub"), R=Math.min(W,H)*0.36, cx=W/2, cy=H/2+10;
  hubs.forEach((h,i)=>{const a=-Math.PI/2+i*2*Math.PI/hubs.length;h.fx=cx+R*Math.cos(a)*(W>H?1.3:1);h.fy=cy+R*Math.sin(a)});
  G.linkSel=g.append("g").selectAll("line").data(links).join("line").attr("class",d=>"link "+d.kind);
  G.nodeSel=g.append("g").selectAll("g").data(nodes).join("g")
    .attr("class",d=>"node "+d.type).attr("tabindex",0).attr("role","button").attr("aria-label",d=>d.label)
    .on("click",(e,d)=>{e.stopPropagation();selectNode(d.id)})
    .on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selectNode(d.id)}})
    .call(d3.drag().on("start",(e,d)=>{if(!e.active)G.sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y})
      .on("end",(e,d)=>{if(!e.active)G.sim.alphaTarget(0);if(d.type!=="hub"){d.fx=null;d.fy=null}}));
  const unit=G.ind.size.unit;
  G.nodeSel.each(function(d){
    const s=d3.select(this);
    if(d.type==="news"){
      const neg=d.ref.companies.length&&d.ref.companies.every(e=>e.dir<0);
      s.append("rect").attr("x",-7).attr("y",-7).attr("width",14).attr("height",14).attr("rx",3)
        .attr("fill",neg?"var(--surface)":"var(--ink)").attr("stroke",neg?"var(--neg)":"var(--surface)").attr("stroke-width",neg?2.5:2);
      s.append("text").attr("x",11).attr("y",4).text(d.label);
    }else{
      s.append("circle").attr("r",d.r).attr("fill",d.ref.size==null?"var(--nulls)":d.ref.jp?"var(--jp)":"var(--ov)").attr("stroke","var(--surface)").attr("stroke-width",2);
      s.append("text").attr("text-anchor","middle").attr("y",d.r+17).text(d.label);
      s.append("text").attr("class","val").attr("text-anchor","middle").attr("y",d.r+31).text(d.ref.size!=null?d.ref.size+unit:"確認中");
    }
  });
  const pad=36;
  G.sim=d3.forceSimulation(nodes)
    .force("link",d3.forceLink(links).id(d=>d.id).distance(l=>l.target.r+70).strength(0.5))
    .force("charge",d3.forceManyBody().strength(d=>d.type==="news"?-380:-200))
    .force("collide",d3.forceCollide().radius(d=>d.type==="news"?58:d.r+40))
    .force("x",d3.forceX(W/2).strength(0.03)).force("y",d3.forceY(H/2).strength(0.03))
    .on("tick",()=>{
      nodes.forEach(d=>{d.x=Math.max(pad,Math.min(W-140,d.x));d.y=Math.max(pad+14,Math.min(H-pad,d.y))});
      G.linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
      G.nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
    });
}
function highlight(id){
  if(!G.nodeSel)return;
  if(!id){G.nodeSel.classed("dim",false);G.linkSel.classed("dim",false);return}
  const nb=new Set([id]);G.links.forEach(l=>{if(l.source.id===id)nb.add(l.target.id);if(l.target.id===id)nb.add(l.source.id)});
  G.nodeSel.classed("dim",d=>!nb.has(d.id));G.linkSel.classed("dim",l=>!(l.source.id===id||l.target.id===id));
}
function selectNode(id){
  const panel=document.getElementById("panel"); if(!panel)return;
  const nd=G.nodes.find(n=>n.id===id); if(!nd)return; highlight(id);
  const ind=G.ind; let h=`<button class="close" aria-label="閉じる" onclick="intro()">×</button>`;
  if(nd.type==="news"){
    const n=nd.ref;
    const ch=n.companies.map(x=>`<span class="chip ${x.dir>0?"pos-t":"neg-t"}">${esc(coName(ind,x.id))}に${x.dir>0?"追い風":"向かい風"}</span>`).join("");
    const src=(n.sources||[]).map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></li>`).join("");
    h+=`<h3>${esc(n.title)}</h3><div class="meta">${esc(n.date)}${n.ongoing?"・続いているテーマ":""}・${esc(n.confidence)}</div><p>${esc(n.summary)}</p><h4>会社への影響</h4><div>${ch}</div><h4>元記事</h4><ul>${src}</ul>${cta}`;
  }else{
    const c=nd.ref, rel=G.links.filter(l=>l.target.id===id);
    const li=rel.map(l=>`<li><button class="lnk" onclick="selectNode('${l.source.id}')">${esc(l.source.ref.title)}</button> <span class="${l.kind==="pos"?"pos-t":"neg-t"}" style="font-size:12.5px">${l.kind==="pos"?"追い風":"向かい風"}</span></li>`).join("");
    h+=`<h3>${esc(c.name)}</h3><div class="meta">${esc(ind.size.label)}：${c.size!=null?c.size+ind.size.unit:"確認中"}</div><p>${esc(c.note)}</p><h4>関係するニュース（${rel.length}件）</h4><ul>${li||"<li>この期間はなし</li>"}</ul>${cta}`;
  }
  panel.innerHTML=h; panel.classList.add("open");
}
function intro(){
  highlight(null); const panel=document.getElementById("panel"); if(!panel)return;
  panel.classList.remove("open");
  panel.innerHTML=`<div class="intro"><h3>見方</h3><p>丸が会社、四角がニュースです。ニュースから会社への緑の線は追い風、赤い点線は向かい風。</p><p>丸や四角を押すと、つながっているものだけが浮かび上がり、ここに中身と元記事が出ます。</p>${cta}</div>`;
}
window.selectNode=selectNode; window.intro=intro;

/* ---------- router ---------- */
function route(){
  const h=location.hash.replace(/^#\/?/,"").split("/");
  window.scrollTo(0,0);
  if(h[0]==="i") industry(h[1],h[2]); else if(h[0]==="about") about(); else home();
}
let rt; window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(G.ind&&document.getElementById("net")){buildGraph();drawGraph();intro()}},250)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")intro()});
window.addEventListener("hashchange",route);
loadAll().then(route);
</script>
